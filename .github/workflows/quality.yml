name: Validate Aleatrón

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f index.html
          test -f styles.css
          test -f src/app.js
          test -f assets/favicon.svg

      - name: Check JavaScript syntax
        run: node --check src/app.js

      - name: Check local asset references
        run: |
          grep -q 'href="./styles.css"' index.html
          grep -q 'src="./src/app.js"' index.html
          grep -q 'href="./assets/favicon.svg"' index.html
